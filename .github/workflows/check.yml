name: differential-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt
      - run: rustup default 1.91.1
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compile:fixtures && git diff --exit-code -- fixtures/
      - run: cargo fmt --check --package tvm-tools-cpp
      - run: python3 scripts/run.py check
