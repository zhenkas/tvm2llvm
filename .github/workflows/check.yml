name: differential-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      TVM_WASI_SDK: /tmp/tvm2llvm-wasi-sdk/wasi-sdk-34.0-x86_64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt
      - run: rustup default 1.91.1
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run compile:fixtures && npm run compile:lookups && git diff --exit-code -- fixtures/
      - run: cargo fmt --check --package tvm2llvm
      - run: python3 scripts/run.py check
      - run: python3 scripts/run.py lookups
      - run: git diff --exit-code -- examples/generated/
      - run: python3 scripts/fetch-wasi-sdk.py /tmp/tvm2llvm-wasi-sdk
      - run: python3 scripts/run.py check-v2
      - run: python3 scripts/run.py lookups-v2
      - run: git diff --exit-code -- examples/generated-v2/
