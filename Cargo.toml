[package]
name = "tvm2llvm"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "LGPL-3.0-or-later"
description = "In-memory TVM interpreter versus contract-specialized C++/WebAssembly execution POC"
publish = false

[workspace]
resolver = "2"
members = [".", "vendor/revm-interpreter", "vendor/revm-context-interface", "vendor/revm-context"]
default-members = ["."]

[workspace.package]
publish = false

[patch.crates-io]
revm-context = { path = "vendor/revm-context" }
revm-interpreter = { path = "vendor/revm-interpreter" }
revm-context-interface = { path = "vendor/revm-context-interface" }

[dependencies]
revm-context = { path = "vendor/revm-context", features = ["std"] }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
revm-interpreter = { path = "vendor/revm-interpreter", features = ["std", "memory_limit"] }
revm-context-interface = { path = "vendor/revm-context-interface", features = ["std"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
sha2 = "0.10"
sha3 = "0.10"
wasmtime = { version = "=38.0.4", default-features = false, features = ["cranelift", "runtime", "std", "gc-drc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
