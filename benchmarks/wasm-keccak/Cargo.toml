[package]
name = "tvm2llvm-wasm-keccak"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-3.0-or-later"

# Diagnostic static library only; independent of the interpreter/Wasmtime workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
sha3 = { version = "=0.11.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
